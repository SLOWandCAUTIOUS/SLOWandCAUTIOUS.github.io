<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Island — Album</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <header class="hero" role="banner" aria-label="Omslagsbild">
    <div class="hero-overlay"></div>
    <div class="hero-content wrap">
      <h1 class="brand">Island</h1>
      <p class="tagline">Album</p>
    </div>
  </header>

  <main class="wrap" id="main">
    <p><a href="../../">← Tillbaka till portfolio</a></p>

    <section class="album-gallery" aria-label="Island bilder">
      <div class="photo">
        <a href="../island1.svg" data-title="Island - bild 1"><picture>
          <source srcset="../island1.svg" type="image/svg+xml">
          <img src="../island1_thumb.svg" alt="Island bild 1" loading="lazy">
        </picture></a>
      </div>

      <div class="photo">
        <a href="../island1.svg" data-title="Island - bild 2"><picture>
          <source srcset="../island1.svg" type="image/svg+xml">
          <img src="../island1_thumb.svg" alt="Island bild 2" loading="lazy">
        </picture></a>
      </div>

      <div class="photo">
        <a href="../island1.svg" data-title="Island - bild 3"><picture>
          <source srcset="../island1.svg" type="image/svg+xml">
          <img src="../island1_thumb.svg" alt="Island bild 3" loading="lazy">
        </picture></a>
      </div>
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" aria-label="Gå till toppen">↑</button>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="close" aria-label="Stäng">×</button>
    <img class="lightbox-img" src="" alt="">
    <div class="caption"></div>
    <button class="prev" aria-label="Föregående">‹</button>
    <button class="next" aria-label="Nästa">›</button>
  </div>

  <script src="../../js/script.js"></script>
</body>
</html>
