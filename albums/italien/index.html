<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Italien — Album</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <header class="hero" role="banner" aria-label="Omslagsbild">
    <div class="hero-overlay"></div>
    <div class="hero-content wrap">
      <h1 class="brand">Italien</h1>
      <p class="tagline">Album</p>
    </div>
  </header>

  <main class="wrap" id="main">
    <p><a href="../../">← Tillbaka till portfolio</a></p>

    <section class="album-gallery" aria-label="Italien bilder">
      <div class="photo">
        <a href="../italien1.jpg" data-title="Italien - bild 1"><picture>
          <source srcset="../italien1.jpg" type="image/jpeg">
          <img src="../italien1_thumb.jpg" alt="Italien bild 1" loading="lazy">
        </picture></a>
      </div>

      <div class="photo">
        <a href="../italien1.jpg" data-title="Italien - bild 2"><picture>
          <source srcset="../italien1.jpg" type="image/jpeg">
          <img src="../italien1_thumb.jpg" alt="Italien bild 2" loading="lazy">
        </picture></a>
      </div>

      <div class="photo">
        <a href="../italien1.jpg" data-title="Italien - bild 3"><picture>
          <source srcset="../italien1.jpg" type="image/jpeg">
          <img src="../italien1_thumb.jpg" alt="Italien bild 3" loading="lazy">
        </picture></a>
      </div>
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" aria-label="Gå till toppen">↑</button>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="close" aria-label="Stäng">×</button>
    <img class="lightbox-img" src="" alt="">
    <div class="caption"></div>
    <button class="prev" aria-label="Föregående">‹</button>
    <button class="next" aria-label="Nästa">›</button>
  </div>

  <script src="../../js/script.js"></script>
</body>
</html>
