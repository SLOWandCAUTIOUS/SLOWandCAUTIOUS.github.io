<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BMW E90 — Album</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body>
  <header class="hero" role="banner" aria-label="Omslagsbild">
    <div class="hero-overlay"></div>
    <div class="hero-content wrap">
      <h1 class="brand">BMW E90</h1>
      <p class="tagline">Album</p>
    </div>
  </header>

  <main class="wrap" id="main">
    <p><a href="../../">← Tillbaka till portfolio</a></p>

    <section class="album-gallery" aria-label="BMW E90 bilder">
      <div class="photo">
        <a href="../bmw/Dusty%20BMW.jpg" data-title="Dusty BMW"><picture>
          <source srcset="../bmw/Dusty%20BMW.jpg" type="image/jpeg">
          <img src="../bmw/Dusty%20BMW.jpg" alt="Dusty BMW" loading="lazy">
        </picture></a>
      </div>

      <div class="photo">
        <a href="../bmw/Poland%20BMW%20mechanic.jpg" data-title="Poland BMW mechanic"><picture>
          <source srcset="../bmw/Poland%20BMW%20mechanic.jpg" type="image/jpeg">
          <img src="../bmw/Poland%20BMW%20mechanic.jpg" alt="Poland BMW mechanic" loading="lazy">
        </picture></a>
      </div>

    </section>
  </main>

  <button id="back-to-top" class="back-to-top" aria-label="Gå till toppen">↑</button>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="close" aria-label="Stäng">×</button>
    <img class="lightbox-img" src="" alt="">
    <div class="caption"></div>
    <button class="prev" aria-label="Föregående">‹</button>
    <button class="next" aria-label="Nästa">›</button>
  </div>

  <script src="../../js/script.js"></script>
</body>
</html>
