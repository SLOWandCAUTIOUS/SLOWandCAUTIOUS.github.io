<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Slow & Cautious — Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Hero / omslagsbild bakom titel -->
  <header class="hero" role="banner" aria-label="Omslagsbild">
    <div class="hero-overlay"></div>
    <div class="hero-content wrap">
      <h1 class="brand">Slow &amp; Cautious</h1>
      <p class="tagline">Fotografi • Portfolio</p>
      <button id="skip-hero" class="skip-hero" aria-label="Gå till innehåll">Hoppa till innehåll</button>
    </div>
  </header>

  <main class="wrap" id="main">
    <section class="profile">
      <div class="profile-left">
        <picture>
          <source srcset="albums/profile_thumb.jpg" type="image/jpeg">
          <img class="avatar" src="albums/profile_thumb.jpg" alt="Profil: Adam" loading="lazy">
        </picture>
      </div>
      <div class="profile-right">
        <div class="profile-name">Adam</div>
        <div class="profile-stats">350 inlägg • 120 följare</div>
        <p class="profile-bio">Enkel portfolio som visar album och enstaka bilder i en gråskalig, industriell stil.</p>
      </div>
    </section>

    <section class="gallery" aria-label="Fotoalbum">
      <a class="tile" href="albums/bmw/index.html" data-title="BMW E90 — 18 bilder" aria-label="Album: BMW E90, 18 bilder">
        <picture>
          <source srcset="albums/dsc01560.jpg" type="image/jpeg">
          <img src="albums/dsc01560.jpg" alt="Thumbnail: BMW E90" loading="lazy">
        </picture>
        <div class="overlay"><div class="meta">BMW E90<br><small>18 bilder</small></div></div>
      </a>

      <a class="tile" href="albums/italien/index.html" data-title="Italien — 42 bilder" aria-label="Album: Italien, 42 bilder">
        <picture>
          <source srcset="albums/dsc01559.jpg" type="image/jpeg">
          <img src="albums/dsc01559.jpg" alt="Thumbnail: Italien" loading="lazy">
        </picture>
        <div class="overlay"><div class="meta">Italien<br><small>42 bilder</small></div></div>
      </a>

      <a class="tile" href="albums/island/index.html" data-title="Island — 27 bilder" aria-label="Album: Island, 27 bilder">
        <picture>
          <source srcset="albums/dsc01560.jpg" type="image/jpeg">
          <img src="albums/dsc01560.jpg" alt="Thumbnail: Island" loading="lazy">
        </picture>
        <div class="overlay"><div class="meta">Island<br><small>27 bilder</small></div></div>
      </a>

      <!-- Fler tiles kan läggas till här -->
    </section>
  </main>

  <button id="back-to-top" class="back-to-top" aria-label="Gå till toppen">↑</button>

  <footer class="site-footer">
    <div class="wrap">
      <small>© <span id="year"></span> Slow &amp; Cautious</small>
    </div>
  </footer>

  <!-- Lightbox (behålls för album-sidor också) -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="close" aria-label="Stäng">×</button>
    <img class="lightbox-img" src="" alt="">
    <div class="caption"></div>
    <button class="prev" aria-label="Föregående">‹</button>
    <button class="next" aria-label="Nästa">›</button>
  </div>

  <script src="js/script.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
